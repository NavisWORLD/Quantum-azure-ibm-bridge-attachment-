[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "qbt-bridge"
version = "0.4.0"
description = "Provider-neutral Quantum Bridge Transformer integration layer for IBM Quantum, Azure Quantum, simulators, and classical AI systems."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Cory Shane Davis"}]
keywords = ["quantum", "ai", "transformer", "ibm-quantum", "azure-quantum", "provenance", "entropy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
ibm = ["qiskit>=2.4", "qiskit-ibm-runtime>=0.46.1"]
azure = ["qdk[azure]", "azure-identity>=1.17"]
torch = ["torch>=2.2"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
qbt = "qbt_bridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qbt_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
