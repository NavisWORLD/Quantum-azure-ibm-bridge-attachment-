name: Platform Compatibility

on:
  push:
    branches: ["main", "agent/**"]
  pull_request:

jobs:
  rust-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustc --version && cargo --version
      - run: cargo test --workspace --all-targets

  sidecar-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - run: python tools/sidecar_smoke.py

  native-ffi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build -p qbt-ffi
      - name: C smoke
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Irust/qbt-ffi/include rust/qbt-ffi/examples/smoke.c -Ltarget/debug -lqbt_ffi -o /tmp/qbt-c-smoke
          LD_LIBRARY_PATH=target/debug /tmp/qbt-c-smoke
      - name: C++ smoke
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Irust/qbt-ffi/include rust/qbt-ffi/examples/smoke.cpp -Ltarget/debug -lqbt_ffi -o /tmp/qbt-cpp-smoke
          LD_LIBRARY_PATH=target/debug /tmp/qbt-cpp-smoke
