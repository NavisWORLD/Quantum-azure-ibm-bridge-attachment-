name: One-shot Rustfmt Fix

on:
  push:
    branches: ["agent/universal-language-compatibility"]

permissions:
  contents: write

concurrency:
  group: one-shot-rustfmt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/universal-language-compatibility
      - run: rustup component add rustfmt
      - run: cargo fmt --all
      - name: Commit formatter output if needed
        run: |
          if git diff --quiet; then
            echo "No formatter changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/qbt-bridge rust/qbt-ffi
          git commit -m "Apply rustfmt to QBT workspace"
          git push origin HEAD:agent/universal-language-compatibility
