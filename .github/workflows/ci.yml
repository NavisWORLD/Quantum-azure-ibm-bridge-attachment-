name: CI

on:
  push:
    branches: ["main", "agent/**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: ruff check src tests examples tools

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Rust toolchain
        run: rustc --version && cargo --version
      - name: Ensure formatting and lint components
        run: rustup component add rustfmt clippy
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust workspace tests
        run: cargo test --workspace --all-targets
      - name: Rust workspace clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustc --version && cargo --version
      - run: cargo test --workspace --all-targets

  native-ffi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build -p qbt-ffi
      - name: Link and run C smoke
        run: |
          gcc -std=c11 -Wall -Wextra -Werror \
            -Irust/qbt-ffi/include rust/qbt-ffi/examples/smoke.c \
            -Ltarget/debug -lqbt_ffi -o /tmp/qbt-c-smoke
          LD_LIBRARY_PATH=target/debug /tmp/qbt-c-smoke
      - name: Link and run C++ smoke
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Irust/qbt-ffi/include rust/qbt-ffi/examples/smoke.cpp \
            -Ltarget/debug -lqbt_ffi -o /tmp/qbt-cpp-smoke
          LD_LIBRARY_PATH=target/debug /tmp/qbt-cpp-smoke

  sidecar-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - run: python tools/sidecar_smoke.py

  language-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Ensure scripting runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli ruby-full perl
      - name: TypeScript declaration check
        run: |
          npm install --global typescript@5
          tsc --noEmit --skipLibCheck false --lib es2022,dom bindings/javascript/index.d.ts
      - name: Run language adapters against live QBT sidecar
        env:
          NO_PROXY: 127.0.0.1,localhost
          no_proxy: 127.0.0.1,localhost
        run: |
          set -euo pipefail
          python -m qbt_bridge.cli serve --host 127.0.0.1 --port 8766 >/tmp/qbt-sidecar.log 2>&1 &
          QBT_PID=$!
          trap 'kill $QBT_PID 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          import urllib.request
          for _ in range(50):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8766/health", timeout=1) as response:
                      if response.status == 200:
                          break
              except Exception:
                  time.sleep(0.1)
          else:
              raise SystemExit("QBT sidecar did not start")
          PY
          node bindings/javascript/smoke.mjs http://127.0.0.1:8766
          (cd bindings/go && go run ./cmd/smoke http://127.0.0.1:8766)
          mkdir -p /tmp/qbt-java
          javac -d /tmp/qbt-java bindings/jvm/src/dev/qbt/QbtClient.java bindings/jvm/src/dev/qbt/Smoke.java
          java -cp /tmp/qbt-java dev.qbt.Smoke http://127.0.0.1:8766
          dotnet run --project bindings/dotnet/QbtSmoke/QbtSmoke.csproj -- http://127.0.0.1:8766
          php bindings/php/smoke.php http://127.0.0.1:8766
          ruby bindings/ruby/smoke.rb http://127.0.0.1:8766
          perl bindings/perl/smoke.pl http://127.0.0.1:8766
          bash bindings/shell/smoke.sh http://127.0.0.1:8766

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Compile and run Swift adapter
        run: |
          set -euo pipefail
          python -m qbt_bridge.cli serve --host 127.0.0.1 --port 8766 >/tmp/qbt-sidecar.log 2>&1 &
          QBT_PID=$!
          trap 'kill $QBT_PID 2>/dev/null || true' EXIT
          sleep 1
          swiftc bindings/swift/QbtClient.swift bindings/swift/Smoke.swift -o /tmp/qbt-swift-smoke
          /tmp/qbt-swift-smoke http://127.0.0.1:8766

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Run PowerShell adapter against QBT sidecar
        shell: pwsh
        run: |
          $process = Start-Process python -ArgumentList "-m", "qbt_bridge.cli", "serve", "--host", "127.0.0.1", "--port", "8766" -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 50; $i++) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8766/health" -Method Get
                if ($health.status -eq "ok") { $ready = $true; break }
              } catch {
                Start-Sleep -Milliseconds 100
              }
            }
            if (-not $ready) { throw "QBT sidecar did not start" }
            & ./bindings/powershell/smoke.ps1 -BaseUrl "http://127.0.0.1:8766"
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
