name: Packaged Applications

on:
  pull_request:
    paths:
      - "apps/**"
      - "packaging/**"
      - ".github/workflows/distribution.yml"
      - "DISTRIBUTION.md"
      - "RELEASE_NOTES_0.4.0.md"
      - ".release/v0.4.0"
      - "pyproject.toml"
      - "src/qbt_bridge/__init__.py"
      - "rust/**/Cargo.toml"
  push:
    branches: ["main"]
    paths:
      - ".release/v0.4.0"

permissions:
  contents: write

concurrency:
  group: qbt-distribution-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: "0.4.0"
  RELEASE_TAG: "v0.4.0"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install --upgrade pip pyinstaller
      - run: pip install -e .
      - name: Build QBT Desktop EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name QBT-Desktop --collect-all qbt_bridge apps/desktop/qbt_desktop.py
      - name: Build Rust CLI
        run: cargo build -p qbt-bridge --bin qbt-rs --release
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress
      - name: Build one-click installer
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\QBT.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release-artifacts/QBT-Windows-Setup-0.4.0.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install --upgrade pip pyinstaller
      - run: pip install -e .
      - name: Build macOS app
        run: pyinstaller --noconfirm --clean --windowed --name "QBT Desktop" --collect-all qbt_bridge apps/desktop/qbt_desktop.py
      - name: Ad-hoc sign app
        run: codesign --force --deep --sign - "dist/QBT Desktop.app"
      - name: Build Rust CLI
        run: cargo build -p qbt-bridge --bin qbt-rs --release
      - name: Build DMG
        run: |
          mkdir -p "release-staging/QBT 0.4.0" release-artifacts
          cp -R "dist/QBT Desktop.app" "release-staging/QBT 0.4.0/"
          cp target/release/qbt-rs "release-staging/QBT 0.4.0/"
          cp README.md DISTRIBUTION.md LICENSE "release-staging/QBT 0.4.0/"
          hdiutil create -volname "QBT 0.4.0" -srcfolder "release-staging/QBT 0.4.0" -ov -format UDZO "release-artifacts/QBT-macOS-0.4.0.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: release-artifacts/QBT-macOS-0.4.0.dmg

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build Android APKs
        run: gradle -p apps/android :app:assembleDebug :app:assembleRelease
      - name: Package Android assets
        run: |
          mkdir -p release-artifacts
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/QBT-Android-sideload-0.4.0.apk
          cp apps/android/app/build/outputs/apk/release/app-release-unsigned.apk release-artifacts/QBT-Android-unsigned-release-0.4.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-artifacts/*.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS simulator app
        run: |
          mkdir -p release-artifacts ios-build/simulator ios-build/device
          xcodebuild -project apps/ios/QBTMobile.xcodeproj -target QBTMobile -configuration Release -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR="$PWD/ios-build/simulator" build
          ditto -c -k --sequesterRsrc --keepParent "ios-build/simulator/QBT Mobile.app" "release-artifacts/QBT-iOS-simulator-0.4.0.zip"
      - name: Build unsigned iOS device app
        run: |
          xcodebuild -project apps/ios/QBTMobile.xcodeproj -target QBTMobile -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR="$PWD/ios-build/device" build
          ditto -c -k --sequesterRsrc --keepParent "ios-build/device/QBT Mobile.app" "release-artifacts/QBT-iOS-unsigned-device-0.4.0.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: release-artifacts/*.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p qbt-bridge --bin qbt-rs --release
      - run: |
          mkdir -p release-artifacts/qbt-linux
          cp target/release/qbt-rs README.md LICENSE release-artifacts/qbt-linux/
          tar -C release-artifacts -czf release-artifacts/qbt-rs-linux-x86_64-0.4.0.tar.gz qbt-linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: release-artifacts/qbt-rs-linux-x86_64-0.4.0.tar.gz

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, macos, android, ios, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --title "QBT 0.4.0 — Packaged Applications" --notes-file RELEASE_NOTES_0.4.0.md --latest
          else
            gh release create "$RELEASE_TAG" release-assets/* --target "$GITHUB_SHA" --title "QBT 0.4.0 — Packaged Applications" --notes-file RELEASE_NOTES_0.4.0.md --latest
          fi
