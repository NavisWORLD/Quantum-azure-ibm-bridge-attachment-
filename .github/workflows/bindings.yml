name: Language Bindings

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - run: sudo apt-get update && sudo apt-get install -y php-cli ruby-full perl
      - name: TypeScript declarations
        run: |
          npm install --global typescript@5
          tsc --noEmit --skipLibCheck false --lib es2022,dom bindings/javascript/index.d.ts
      - name: Start QBT sidecar
        run: |
          nohup python -m qbt_bridge.cli serve --host 127.0.0.1 --port 8766 >/tmp/qbt-sidecar.log 2>&1 &
          python tools/wait_for_sidecar.py
      - run: node bindings/javascript/smoke.mjs http://127.0.0.1:8766
      - run: cd bindings/go && go run ./cmd/smoke http://127.0.0.1:8766
      - name: Java JVM smoke
        run: |
          mkdir -p /tmp/qbt-java
          javac -d /tmp/qbt-java bindings/jvm/src/dev/qbt/QbtClient.java bindings/jvm/src/dev/qbt/Smoke.java
          java -cp /tmp/qbt-java dev.qbt.Smoke http://127.0.0.1:8766
      - run: dotnet run --project bindings/dotnet/QbtSmoke/QbtSmoke.csproj -- http://127.0.0.1:8766
      - run: php bindings/php/smoke.php http://127.0.0.1:8766
      - run: ruby bindings/ruby/smoke.rb http://127.0.0.1:8766
      - run: perl bindings/perl/smoke.pl http://127.0.0.1:8766
      - run: bash bindings/shell/smoke.sh http://127.0.0.1:8766
